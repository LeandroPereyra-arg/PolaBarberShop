<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Aplicaciones del logo · Pola's Barber Shop</title>
  <link rel="stylesheet" href="marca.css">
  <style>
    .foto { width: 100%; height: 100%; object-fit: cover; }
    .gris { filter: grayscale(1) contrast(1.05); }
  </style>
</head>
<body>
<main class="lamina">
  <header class="lamina__head">
    <h1 class="anton">Aplicaciones del logo</h1>
    <span class="script">en todos lados</span>
  </header>

  <div class="grilla">
    <article class="ficha">
      <div class="ficha__arte"><img class="foto gris" src="../img/local-fachada.jpg" alt="Marquesina del local anterior con el logo"></div>
      <div class="ficha__pie"><strong>Marquesina de la fachada</strong><span class="tag tag--real">Real</span></div>
    </article>

    <article class="ficha">
      <div class="ficha__arte"><img class="foto" src="../img/equipo.jpg" alt="Cartel iluminado con el logo dentro del local" style="object-position: 30% 8%"></div>
      <div class="ficha__pie"><strong>Cartel iluminado interior</strong><span class="tag tag--real">Real</span></div>
    </article>

    <article class="ficha">
      <div class="ficha__arte" style="background:#fafafa">
        <svg viewBox="0 0 240 240">
          <rect x="45" y="12" width="150" height="216" rx="18" fill="#fff" stroke="#ddd"/>
          <circle cx="90" cy="62" r="27" fill="#fff" stroke="#e1306c" stroke-width="3"/>
          <image href="../img/logo.png" x="70" y="38" width="40" height="47"/>
          <text x="128" y="55" font-family="Archivo" font-weight="800" font-size="12">1.051</text>
          <text x="128" y="68" font-family="Archivo" font-size="8" fill="#777">seguidores</text>
          <text x="58" y="106" font-family="Archivo" font-weight="800" font-size="10">polasbarbershop</text>
          <text x="58" y="120" font-family="Archivo" font-size="8" fill="#555">Gral. Madariaga 186 · Barrio Lindo</text>
          <rect x="58" y="130" width="124" height="18" rx="4" fill="#0095f6"/>
          <text x="120" y="142" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="8" fill="#fff">Reservar turno</text>
          <g fill="#ddd"><rect x="58" y="156" width="38" height="38"/><rect x="101" y="156" width="38" height="38"/><rect x="144" y="156" width="38" height="38"/></g>
          <image href="../img/corte-color.jpg" x="58" y="156" width="38" height="38" preserveAspectRatio="xMidYMid slice"/>
          <image href="../img/corte-mullet.jpg" x="101" y="156" width="38" height="38" preserveAspectRatio="xMidYMid slice"/>
          <image href="../img/equipo.jpg" x="144" y="156" width="38" height="38" preserveAspectRatio="xMidYMid slice"/>
        </svg>
      </div>
      <div class="ficha__pie"><strong>Perfil de Instagram</strong><span class="tag tag--real">Real</span></div>
    </article>

    <article class="ficha">
      <div class="ficha__arte marmol">
        <svg viewBox="0 0 240 240">
          <g transform="rotate(-8 110 90)">
            <rect x="20" y="40" width="170" height="100" rx="8" fill="#0a0a0a"/>
            <image href="../img/logo.png" x="80" y="50" width="68" height="80"/>
          </g>
          <g transform="rotate(5 140 170)">
            <rect x="55" y="120" width="170" height="100" rx="8" fill="#f6f4ef" stroke="#d8d2c4"/>
            <text x="70" y="146" font-family="Anton" font-size="14">POLA'S BARBER SHOP</text>
            <text x="70" y="164" font-family="Archivo" font-size="8">Gral. Madariaga 186</text>
            <text x="70" y="176" font-family="Archivo" font-size="8">Malvinas Argentinas</text>
            <text x="70" y="194" font-family="Archivo" font-weight="700" font-size="8" fill="#b77c0c">@polasbarbershop</text>
            <image href="qr/como-llegar.png" x="170" y="150" width="46" height="46"/>
          </g>
        </svg>
      </div>
      <div class="ficha__pie"><strong>Tarjeta personal</strong><span class="tag tag--propuesta">Propuesta</span></div>
    </article>

    <article class="ficha">
      <div class="ficha__arte" style="background:#e9e6df">
        <svg viewBox="0 0 240 240">
          <rect x="14" y="60" width="212" height="130" rx="8" fill="#fff" stroke="#ccc"/>
          <path d="M14 68 a8 8 0 0 1 8 -8 h196 a8 8 0 0 1 8 8 v22 h-212 z" fill="#dedad2"/>
          <path d="M24 90 v-18 a6 6 0 0 1 6 -6 h96 a6 6 0 0 1 6 6 v18 z" fill="#fff"/>
          <image href="isotipo.svg" x="32" y="70" width="14" height="14"/>
          <text x="52" y="81" font-family="Archivo" font-size="8">Pola's Barber Shop · Turnos</text>
          <rect x="14" y="90" width="212" height="100" fill="#0a0a0a"/>
          <text x="30" y="128" font-family="Anton" font-size="22" fill="#f6f4ef">CORTES</text>
          <text x="30" y="152" font-family="Anton" font-size="22" fill="#eeb637">CON ESTILO</text>
          <rect x="30" y="162" width="62" height="14" rx="7" fill="#e8a21c"/>
          <text x="61" y="172" text-anchor="middle" font-family="Anton" font-size="7">RESERVAR</text>
          <image href="../img/logo.png" x="150" y="102" width="62" height="73"/>
        </svg>
      </div>
      <div class="ficha__pie"><strong>Sitio web y favicon</strong><span class="tag tag--real">Real</span></div>
    </article>

    <article class="ficha">
      <div class="ficha__arte" style="background:linear-gradient(160deg,#2b3236,#0f1214)">
        <svg viewBox="0 0 240 240">
          <rect x="20" y="16" width="200" height="208" fill="none" stroke="#555" stroke-width="4"/>
          <path d="M40 16 L90 16 L30 224 L20 224 Z" fill="#fff" opacity=".05"/>
          <path d="M120 16 L140 16 L80 224 L60 224 Z" fill="#fff" opacity=".04"/>
          <image href="logo/logo-monocromo-blanco.png" x="70" y="34" width="100" height="118"/>
          <text x="120" y="176" text-anchor="middle" font-family="Anton" font-size="16" fill="#fff">TURNOS ONLINE</text>
          <text x="120" y="194" text-anchor="middle" font-family="Archivo" font-size="9" fill="#ddd">Lun a sáb · @polasbarbershop</text>
        </svg>
      </div>
      <div class="ficha__pie"><strong>Vinilo de vidriera</strong><span class="tag tag--propuesta">Propuesta</span></div>
    </article>

    <article class="ficha">
      <div class="ficha__arte marmol">
        <svg viewBox="0 0 240 240">
          <ellipse cx="120" cy="208" rx="80" ry="9" fill="#000" opacity=".15"/>
          <rect x="50" y="104" width="140" height="96" rx="12" fill="#1b1b1b"/>
          <rect x="42" y="74" width="156" height="42" rx="10" fill="#111"/>
          <rect x="62" y="126" width="116" height="60" rx="6" fill="#f4f1ea"/>
          <image href="../img/logo.png" x="68" y="129" width="45" height="53"/>
          <text x="148" y="154" text-anchor="middle" font-family="Anton" font-size="14">POMADA</text>
          <text x="148" y="170" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="8" fill="#b77c0c" letter-spacing="1.5">MATE</text>
        </svg>
      </div>
      <div class="ficha__pie"><strong>Etiqueta de producto</strong><span class="tag tag--propuesta">Propuesta</span></div>
    </article>

    <article class="ficha">
      <div class="ficha__arte" style="background:#e9e6df">
        <svg viewBox="0 0 240 240">
          <path d="M60 20 h120 v190 l-10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 -10 8 -10 -8 z" fill="#fff" stroke="#d6d0c4"/>
          <image href="../img/logo.png" x="100" y="30" width="40" height="47"/>
          <text x="120" y="94" text-anchor="middle" font-family="Yellowtail" font-size="16" fill="#eeb637">¡gracias!</text>
          <text x="120" y="112" text-anchor="middle" font-family="Anton" font-size="13">COMPRA CONFIRMADA</text>
          <rect x="82" y="120" width="76" height="16" fill="none" stroke="#111" stroke-dasharray="3 2"/>
          <text x="120" y="131" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="8">Pedido PB-987867</text>
          <g font-family="Archivo" font-size="8"><text x="72" y="154">1 × Remera Pola's</text><text x="168" y="154" text-anchor="end">$18.000</text>
          <text x="72" y="168">2 × Pomada Mate</text><text x="168" y="168" text-anchor="end">$19.000</text></g>
          <line x1="72" y1="176" x2="168" y2="176" stroke="#111"/>
          <text x="72" y="190" font-family="Anton" font-size="11">TOTAL</text><text x="168" y="190" text-anchor="end" font-family="Anton" font-size="11">$40.500</text>
        </svg>
      </div>
      <div class="ficha__pie"><strong>Comprobante de compra</strong><span class="tag tag--real">Real</span></div>
    </article>

    <article class="ficha">
      <div class="ficha__arte" style="background:#efebe3">
        <svg viewBox="0 0 240 240">
          <path d="M88 64 q0 -34 32 -34 q32 0 32 34" fill="none" stroke="#8a6a3e" stroke-width="5"/>
          <path d="M50 64 h140 l12 150 h-164 z" fill="#c8a97e"/>
          <path d="M50 64 h140 l-4 10 h-132 z" fill="#b39265"/>
          <image href="logo/logo-monocromo-negro.png" x="88" y="94" width="64" height="75" opacity=".85"/>
          <text x="120" y="194" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="8" letter-spacing="2">MALVINAS ARGENTINAS</text>
        </svg>
      </div>
      <div class="ficha__pie"><strong>Bolsa con sello a una tinta</strong><span class="tag tag--propuesta">Propuesta</span></div>
    </article>
  </div>
</main>
</body>
</html>
